name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements-dev.txt
          python -m pytest
